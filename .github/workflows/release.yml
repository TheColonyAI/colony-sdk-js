# Release workflow for @thecolony/sdk
#
# Triggered by pushing a `vX.Y.Z` tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
#
# What it does:
#   1. Verifies the tag matches `package.json` `version` (refuses to publish if not).
#   2. Runs the full test/lint/build matrix.
#   3. Publishes to npm via Trusted Publishing — short-lived OIDC token, no
#      long-lived NPM_TOKEN stored anywhere. Provenance attestations are
#      attached to the published tarball so consumers can verify it built
#      from this exact commit.
#   4. Publishes to JSR (jsr.io) via OIDC tokenless publishing — ships the
#      TypeScript source directly so Deno users get native TS support.
#   5. Creates a GitHub Release with the changelog entry as release notes.
#
# Pre-release checklist lives in RELEASING.md. Trusted Publisher setup on
# npmjs.com and JSR linking are one-time manual steps also documented there.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches every version source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # The version lives in THREE places and this step used to check one.
        # jsr.json and the exported VERSION constant both sat at 0.15.0 through
        # the 0.16.0 and 0.17.0 releases; because only package.json was checked,
        # both releases went green while JSR published nothing (see publish-jsr
        # below). Check all three, and report every mismatch rather than the
        # first — a release cut with two stale files should say so once.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          JSR_VERSION=$(node -p "require('./jsr.json').version")
          SRC_VERSION=$(node -p "
            const m = require('fs').readFileSync('src/index.ts', 'utf8')
              .match(/export const VERSION = \"([^\"]+)\"/);
            m ? m[1] : 'NOT-FOUND';
          ")

          echo "tag             $TAG_VERSION"
          echo "package.json    $PKG_VERSION"
          echo "jsr.json        $JSR_VERSION"
          echo "src/index.ts    $SRC_VERSION"

          FAILED=0
          for pair in "package.json:$PKG_VERSION" "jsr.json:$JSR_VERSION" "src/index.ts:$SRC_VERSION"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$TAG_VERSION" != "$value" ]; then
              echo "::error::$name says $value but the tag says $TAG_VERSION"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    name: Publish to npm
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing — npm uses this OIDC token to
      # verify the workflow against the publisher config on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: Publish to JSR
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for JSR OIDC-based tokenless publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: npx jsr publish
      # `jsr publish` exits 0 when the version already exists — it prints
      # "Warning: Skipping, already published" and succeeds. That is how
      # 0.16.0 and 0.17.0 shipped to npm with a fully green release while JSR
      # stayed on 0.15.0: nothing in the pipeline distinguished "published" from
      # "declined to publish". Both versions are permanently absent from JSR.
      #
      # verify-tag now catches the stale-jsr.json cause, but a step whose
      # success is unconditional is worth closing on its own — the next cause
      # need not be a version mismatch. Ask the registry what it actually
      # serves, which is the only answer that cannot be vacuous.
      - name: Verify JSR actually serves this version
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-tag.outputs.version }}"
          # The registry is read-after-write; give it a moment to be consistent.
          for attempt in 1 2 3 4 5; do
            LATEST=$(curl -fsSL https://jsr.io/@thecolony/sdk/meta.json \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).latest ?? ''")
            echo "attempt $attempt: jsr latest = ${LATEST:-<none>}"
            if [ "$LATEST" = "$VERSION" ]; then
              echo "JSR serves $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::JSR still reports latest=${LATEST:-<none>}, expected $VERSION. \
          The publish step passed without publishing — check for a \
          'Skipping, already published' warning above."
          exit 1

  github-release:
    name: Create GitHub Release
    needs: [verify-tag, publish, publish-jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ needs.verify-tag.outputs.version }}"
          # Pull the section between this version's H2 header and the next H2.
          # If CHANGELOG.md is missing the section, fall back to a generic note.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" '
              $0 ~ "^"ver" " || $0 == ver { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release v$VERSION (no CHANGELOG entry found)" > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.verify-tag.outputs.version }}" \
            --title "v${{ needs.verify-tag.outputs.version }}" \
            --notes-file release-notes.md
