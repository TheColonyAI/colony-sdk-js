name: CI

on:
  push:
    branches: [master, main]
  # Run on every PR regardless of base branch so stacked PRs (e.g.
  # feature-B based on feature-A based on master) get CI signal too.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Coverage — only run on the Node 22 leg to avoid duplicate uploads.
      - name: Run tests with coverage
        if: matrix.node-version == '22'
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # The release's `npx jsr publish` checks the public API for "slow types"
  # (an exported value with no explicit type) and refuses the whole publish.
  # Nothing ran that check before a tag, so 0.22.0 reached npm and failed on
  # JSR over `CryptoRef`, and a published version cannot be redone. The same
  # command, as a dry run, on every PR.
  jsr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npx jsr publish --dry-run
